name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, exif, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          touch database/database.sqlite

      - name: Verify Composer dependencies
        run: composer audit --no-interaction

      - name: Verify database migrations
        run: php artisan migrate --force --no-interaction

      - run: npm ci

      - name: Verify npm dependencies
        run: npm audit --audit-level=high

      - name: Check PHP formatting
        run: vendor/bin/pint --test --format agent

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run test suite
        run: php -d memory_limit=512M vendor/bin/pest --compact

      - name: Verify Laravel caches
        run: |
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

      - name: Build frontend assets
        run: npm run build
