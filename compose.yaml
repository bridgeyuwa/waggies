name: waggies

services:
    postgres:
        build:
            context: .
            dockerfile: docker/postgres/Dockerfile
            args:
                PGVECTOR_VERSION: 0.8.1
        image: waggies-postgres:18.6-pgvector-0.8.1
        container_name: waggies-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: waggies
            POSTGRES_DB: waggies
            POSTGRES_HOST_AUTH_METHOD: trust
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - waggies-postgres-data:/var/lib/postgresql
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U waggies -d waggies"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

volumes:
    waggies-postgres-data:
